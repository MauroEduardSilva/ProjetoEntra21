<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FreeToBee</title>
</head>
<body>
    <h1>Cadastrar Usuário</h1>
    
	<form action="/cadastramento/newServlet.java" method="post">
		<label  for="nome">Nome</label>
		<input type="text" id="nome" name="nome"><br>
		
		<label  for="sobrenome">Sobrenome</label>
		<input type="text" id="sobrenome" name="sobrenome"><br>
		
		<label  for="apelido">Apelido</label>
		<input type="text" id="apelido" name="apelido"><br>
		
		<label  for="email">Email</label>
		<input type="text" id="email" name="email"><br>
		
		<label  for="senha">Senha</label>
		<input type="text" id="senha" name="senha"><br>
		
		<label  for="confirmar">Confirmação da Senha</label>
		<input type="text" id="confirmar" name="confirmar"><br>
		
		<button type="submit">Próximo</button><br>
		<button type="reset">Limpar Fomulário</button>
	</form>
</body>
</html>
